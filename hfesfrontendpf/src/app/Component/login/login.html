<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <h1>HFES</h1>
      <p>Rincón Guatemalteco</p>
    </div>

    <h2>Iniciar Sesión</h2>

    <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>

    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" class="form-control" [(ngModel)]="nombreUsuario"
             placeholder="Nombre de usuario" (keyup.enter)="login()" />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" class="form-control" [(ngModel)]="password"
             placeholder="Contraseña" (keyup.enter)="login()" />
    </div>

    <button class="btn btn-login" (click)="login()" [disabled]="cargando">
      {{ cargando ? 'Verificando...' : 'Ingresar' }}
    </button>
  </div>
</div>
