<div class="crud-container">
  <div class="crud-header">
    <h2>Gestión de Roles</h2>
    <button class="btn btn-primary" (click)="abrirFormularioNuevo()">+ Nuevo Rol</button>
  </div>

  <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>

  <!-- Formulario -->
  <div class="formulario-card" *ngIf="mostrarFormulario">
    <h3>{{ modoEdicion ? 'Editar Rol' : 'Nuevo Rol' }}</h3>
    <div class="form-group">
      <label for="nombre">Nombre del Rol</label>
      <input id="nombre" type="text" class="form-control" [(ngModel)]="rolSeleccionado.nombre" placeholder="Ej: Administrador" />
    </div>
    <div class="form-actions">
      <button class="btn btn-success" (click)="guardar()">Guardar</button>
      <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </div>
  </div>

  <!-- Tabla -->
  <table class="tabla-crud" *ngIf="roles.length > 0">
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rol of roles">
        <td>{{ rol.idRole }}</td>
        <td>{{ rol.nombre }}</td>
        <td class="acciones">
          <button class="btn btn-warning btn-sm" (click)="editarRol(rol)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminar(rol.idRole)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="sin-datos" *ngIf="roles.length === 0">No hay roles registrados.</p>
</div>
