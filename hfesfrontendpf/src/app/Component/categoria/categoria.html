<div class="crud-container">
  <div class="crud-header">
    <h2>Gestión de Categorías</h2>
    <button class="btn btn-primary" (click)="abrirFormularioNuevo()">+ Nueva Categoría</button>
  </div>

  <div class="alert alert-danger" *ngIf="mensajeError">{{ mensajeError }}</div>

  <!-- Formulario -->
  <div class="formulario-card" *ngIf="mostrarFormulario">
    <h3>{{ modoEdicion ? 'Editar Categoría' : 'Nueva Categoría' }}</h3>
    <div class="form-group">
      <label for="nombre">Nombre de la Categoría</label>
      <input id="nombre" type="text" class="form-control" [(ngModel)]="categoriaSeleccionada.nombre" placeholder="Ej: Bebidas" />
    </div>
    <div class="form-actions">
      <button class="btn btn-success" (click)="guardar()">Guardar</button>
      <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
    </div>
  </div>

  <!-- Tabla -->
  <table class="tabla-crud" *ngIf="categorias.length > 0">
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let categoria of categorias">
        <td>{{ categoria.idCategoria }}</td>
        <td>{{ categoria.nombre }}</td>
        <td class="acciones">
          <button class="btn btn-warning btn-sm" (click)="editarCategoria(categoria)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="eliminar(categoria.idCategoria)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="sin-datos" *ngIf="categorias.length === 0">No hay categorías registradas.</p>
</div>
